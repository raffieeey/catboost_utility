[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catboost-utility"
version = "0.2.0"
description = "CatBoost-based feature selection utilities with native categorical support (VIF, Boruta, RFE, and more)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "catboost>=1.0",
    "pandas>=1.3",
    "numpy>=1.21",
    "scipy>=1.7",
    "joblib>=1.0",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
progress = ["tqdm>=4.60"]
dev = [
    "pytest>=7.0",
    "tqdm>=4.60",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "catboost_utility*",
]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
testpaths = [
    "catboost_utility/vif_catboost/tests",
    "catboost_utility/boruta_catboost/tests",
    "catboost_utility/rfe_catboost/tests",
]
